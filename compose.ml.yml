# Optional CPU inference using a model downloaded into ./models on the host.
services:
  api:
    build:
      args:
        EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
    environment:
      EMBEDDING_MODEL_PATH: /models/multilingual-e5-small-ru-law
      EMBEDDING_DEVICE: cpu
    volumes:
      - ./models:/models:ro
