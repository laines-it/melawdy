name: melawdy

services:
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-melawdy}
      POSTGRES_USER: ${POSTGRES_USER:-melawdy_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melawdy_local_dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@melawdy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Администратор}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    volumes:
      - model_cache:/opt/hf-cache
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    build:
      context: ./deploy/postgres
    image: melawdy-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-melawdy}
      POSTGRES_USER: ${POSTGRES_USER:-melawdy_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melawdy_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    build:
      context: ./deploy/minio
    image: melawdy-minio:local
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-melawdy_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-melawdy_local_dev_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  model_cache:
  postgres_data:
  minio_data:
