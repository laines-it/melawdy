limit_req_zone $binary_remote_addr zone=melawdy_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=melawdy_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=melawdy_password:10m rate=5r/m;

resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
resolver_timeout 3s;

upstream melawdy_api {
    zone melawdy_api 64k;
    server ${NGINX_API_HOST}:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    limit_req_status 429;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /api/v1/auth/login {
        limit_req zone=melawdy_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://melawdy_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/register {
        limit_req zone=melawdy_register burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/change-password {
        limit_req zone=melawdy_password burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api/ {
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
