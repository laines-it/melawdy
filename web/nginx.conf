limit_req_zone $binary_remote_addr zone=melawdy_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=melawdy_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=melawdy_password:10m rate=5r/m;

resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
resolver_timeout 3s;

upstream melawdy_api {
    zone melawdy_api 64k;
    server ${NGINX_API_HOST}:8000 resolve;
    keepalive 32;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff2
    application/font-woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(conf|md|log|bak|sql|ini|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /api/v1/auth/login {
        limit_req zone=melawdy_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/v1/auth/register {
        limit_req zone=melawdy_register burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/v1/auth/change-password {
        limit_req zone=melawdy_password burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://melawdy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Генерация DOCX и анализ аудио могут быть долгими
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* ^/(css|js|img|images|fonts)/.+\.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Шрифты на верхнем уровне (brand-mark.png, substrate.png, important.png и т.п.)
    location ~* ^/.+\.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/article/[^/]+/?$ {
        try_files /article.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}