name: Tests

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run local Python tests
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: melawdy_test
          POSTGRES_USER: melawdy_test
          POSTGRES_PASSWORD: melawdy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U melawdy_test -d melawdy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: melawdy_test
      POSTGRES_USER: melawdy_test
      POSTGRES_PASSWORD: melawdy_test_password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check PostgreSQL and pgvector
        run: python -m pytest -q backend/tests/integration
